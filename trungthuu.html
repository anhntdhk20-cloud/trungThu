<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đêm Trung Thu 3D</title>
<style>
:root{--bg:#080416;--text:#fff7f0;--muted:#d8c9e5;--accent:#ff9b52;--pink:#ff6fae}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Segoe UI,system-ui,sans-serif}#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}#title{position:fixed;top:calc(14px + env(safe-area-inset-top));left:0;right:0;text-align:center;z-index:3;pointer-events:none}h1{font-size:clamp(17px,4vw,23px);margin:0;letter-spacing:1.5px;text-shadow:0 0 12px #ff8c5099}#title p{margin:7px 0;color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.8}#hint{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:3;padding:9px 15px;border:1px solid #ffd6ae33;border-radius:999px;background:#130a26a0;backdrop-filter:blur(12px);color:var(--muted);font-size:12px;white-space:nowrap}#cardOverlay{position:fixed;inset:0;z-index:5;display:none;place-items:center;background:#050210b3;backdrop-filter:blur(8px);padding:20px}.show{display:grid!important}#card{width:min(360px,100%);padding:26px 22px;text-align:center;border:1px solid #ffaf7866;border-radius:18px;background:linear-gradient(160deg,#2a1740,#4a1f3a);box-shadow:0 24px 80px #0009;animation:pop .35s ease}#card .lantern-emoji{font-size:40px}#card p{font-size:17px;line-height:1.5;margin:10px 0 18px}button{width:100%;padding:9px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--pink));color:#20101c;font-weight:700;font-size:14px}@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="scene"></div><div id="title"><h1>🏮 Đêm Trăng Trung Thu 🏮</h1><p>Một đêm rằm thật dịu dàng</p></div><div id="hint">Kéo để xoay • Cuộn để zoom • Chạm vào lồng đèn để xem lời chúc</div>
<div id="cardOverlay"><div id="card"><div class="lantern-emoji">🏮</div><p id="cardMsg"></p><button onclick="closeCard()">Đóng</button></div></div>
<iframe id="musicPlayer" style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none" src="https://www.youtube.com/embed/UdZeeNYpQys?autoplay=1&loop=1&playlist=UdZeeNYpQys&controls=0&rel=0&playsinline=1&enablejsapi=1" allow="autoplay; encrypted-media" aria-hidden="true"></iframe>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x0a0618,.018);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);let dist=22,theta=.5,phi=1.15;function cameraUpdate(){camera.position.set(dist*Math.sin(phi)*Math.sin(theta),dist*Math.cos(phi)+3,dist*Math.sin(phi)*Math.cos(theta));camera.lookAt(0,4,0)}cameraUpdate();const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;document.getElementById('scene').appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x51406f,.7));const moonLight=new THREE.PointLight(0xffc766,1.8,65);moonLight.position.set(0,16,-6);scene.add(moonLight);const warm=new THREE.PointLight(0xff8f4d,.9,30);warm.position.set(0,4,4);scene.add(warm);
// ---------- Cây cổ thụ: thân phân nhánh tự nhiên, vân vỏ, hốc cây và tán nhiều lớp ----------
const tree=new THREE.Group();scene.add(tree);const bark=new THREE.MeshStandardMaterial({color:0x32170f,roughness:.92});const barkLight=new THREE.MeshStandardMaterial({color:0x70402a,roughness:.84});const barkDark=new THREE.MeshStandardMaterial({color:0x1a0b09,roughness:1});
function branch(a,b,r,material=bark){const d=new THREE.Vector3().subVectors(b,a),m=new THREE.Mesh(new THREE.CylinderGeometry(r*.72,r, d.length,12),material);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());tree.add(m);return m}
// Thân cong nhẹ thay vì một hình trụ thẳng.
const trunkPoints=[new THREE.Vector3(0,-1.8,0),new THREE.Vector3(-.12,1,0),new THREE.Vector3(.18,3.6,.05),new THREE.Vector3(-.2,5.7,.08),new THREE.Vector3(.15,7.1,.1)];for(let i=0;i<trunkPoints.length-1;i++)branch(trunkPoints[i],trunkPoints[i+1],.72-i*.1,bark);
const limbs=[[-.2,5.5,.1,-2.8,7.1,.2,.36],[-.1,5.8,.1,2.7,7.25,-.25,.32],[.1,6.3,.1,-1.6,8.4,.25,.26],[.1,6.7,.1,1.55,8.55,.35,.25],[-.2,4.4,.1,-2.05,5.05,.65,.3],[.15,4.9,.1,2.25,5.9,.5,.28]];limbs.forEach(v=>branch(new THREE.Vector3(v[0],v[1],v[2]),new THREE.Vector3(v[3],v[4],v[5]),v[6]));
// Các rãnh vỏ chạy dọc thân tạo chiều sâu khi có ánh trăng.
for(let i=0;i<13;i++){const x=Math.sin(i*2.4)*.34,z=Math.cos(i*1.7)*.35;const g=branch(new THREE.Vector3(x,-1.55,z),new THREE.Vector3(x+Math.sin(i)*.12,5.9,z+Math.cos(i)*.1),.035,i%3?barkDark:barkLight);g.rotation.z=Math.sin(i*1.4)*.06}
// Hốc cây và các mắt gỗ.
const hollow=new THREE.Mesh(new THREE.SphereGeometry(.48,24,16),new THREE.MeshBasicMaterial({color:0x100709}));hollow.scale.set(.75,1.3,.3);hollow.position.set(.2,1.15,.65);tree.add(hollow);for(let i=0;i<7;i++){const knot=new THREE.Mesh(new THREE.TorusGeometry(.1+Math.random()*.06,.025,7,14),barkLight);knot.position.set(Math.sin(i*3)*.38,.2+i*.72,.55);knot.rotation.x=Math.PI/2;knot.scale.y=1.5;tree.add(knot)}
// Tán dạng nhiều cụm cầu + lớp hạt nhỏ, đẹp hơn một đám điểm phẳng.
const leafMats=[new THREE.MeshStandardMaterial({color:0x8b315f,roughness:.9,emissive:0x2a081e,emissiveIntensity:.28}),new THREE.MeshStandardMaterial({color:0xc24f83,roughness:.82,emissive:0x3d0c2b,emissiveIntensity:.3}),new THREE.MeshStandardMaterial({color:0xff86bd,roughness:.75,emissive:0x5a1239,emissiveIntensity:.38})];const canopy=new THREE.Group();tree.add(canopy);const blobs=[[-2.5,7.4,.3,2.25],[-.7,8.1,.1,2.55],[1.4,7.8,.2,2.45],[3,7.25,-.1,1.9],[-1.7,9.2,.1,1.6],[.4,9.5,.2,1.8],[2.1,9,.1,1.55]];blobs.forEach((p,i)=>{const m=new THREE.Mesh(new THREE.IcosahedronGeometry(p[3],2),leafMats[i%leafMats.length]);m.position.set(p[0],p[1],p[2]);m.scale.set(1,.72,.82);canopy.add(m)});
const leafCount=1700,pos=new Float32Array(leafCount*3),col=new Float32Array(leafCount*3);for(let i=0;i<leafCount;i++){const c=blobs[i%blobs.length],r=c[3]*(.55+Math.random()*.6),a=Math.random()*Math.PI*2,u=Math.random()*2-1;pos[i*3]=c[0]+r*Math.sqrt(1-u*u)*Math.cos(a);pos[i*3+1]=c[1]+r*u*.7;pos[i*3+2]=c[2]+r*Math.sqrt(1-u*u)*Math.sin(a);const cc=new THREE.Color(leafMats[i%3].color);cc.offsetHSL((Math.random()-.5)*.04,0,Math.random()-.5>.1?.1:-.08);col.set([cc.r,cc.g,cc.b],i*3)}const leafGeo=new THREE.BufferGeometry();leafGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));leafGeo.setAttribute('color',new THREE.BufferAttribute(col,3));canopy.add(new THREE.Points(leafGeo,new THREE.PointsMaterial({size:.15,vertexColors:true,transparent:true,opacity:.9,depthWrite:false})));tree.position.y=-.3;
// Planet, moon and stars.
const planet=new THREE.Mesh(new THREE.SphereGeometry(7,48,32),new THREE.MeshStandardMaterial({color:0x40336f,roughness:.82,emissive:0x100c2d,emissiveIntensity:.22}));planet.position.y=-3.2;planet.scale.y=.78;scene.add(planet);const moon=new THREE.Mesh(new THREE.SphereGeometry(2.2,40,32),new THREE.MeshBasicMaterial({color:0xffd46a}));moon.position.set(0,15,-8);scene.add(moon);const glow=new THREE.Mesh(new THREE.SphereGeometry(3.05,28,20),new THREE.MeshBasicMaterial({color:0xffad45,transparent:true,opacity:.2,blending:THREE.AdditiveBlending,depthWrite:false}));glow.position.copy(moon.position);scene.add(glow);const stars=new THREE.BufferGeometry(),sp=new Float32Array(1200*3);for(let i=0;i<1200;i++){sp[i*3]=(Math.random()-.5)*100;sp[i*3+1]=3+Math.random()*38;sp[i*3+2]=(Math.random()-.5)*100}stars.setAttribute('position',new THREE.BufferAttribute(sp,3));scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xffe4b0,size:.2,transparent:true,opacity:.9})));
// Rabbit silhouette on the branch.
const rabbit=new THREE.Group(),white=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xfff5ea,emissiveIntensity:.3,roughness:.65});function orb(s,p,sc){const m=new THREE.Mesh(new THREE.SphereGeometry(s,24,16),white);m.position.set(...p);m.scale.set(...sc);rabbit.add(m)}orb(.85,[0,0,0],[1,1.1,1]);orb(.58,[0,1.05,.3],[1,1,.95]);orb(.17,[-.2,1.8,.25],[.7,2.7,.7]);orb(.17,[.2,1.8,.25],[.7,2.7,.7]);rabbit.position.set(.1,4.5,.9);rabbit.scale.setScalar(.8);scene.add(rabbit);
// Lanterns remain interactive.
const lanterns=[],group=new THREE.Group();scene.add(group);const messages=['Chúc bạn Trung Thu ấm áp bên gia đình, đủ đầy như ánh trăng rằm 🌕','Ước mong mọi buồn lo tan theo ánh đèn lồng, chỉ còn lại niềm vui ở lại 🏮','Trăng tròn thì lòng người cũng tròn, chúc bạn luôn hạnh phúc và bình an ✨','Gửi bạn một chiếc bánh Trung Thu ngọt ngào, chúc năm mới học hành tấn tới 🥮','Chúc bạn có một mùa Trung Thu rực rỡ như muôn ngàn ánh đèn lồng 🎇','Trung Thu về, chúc bạn luôn được yêu thương và trân trọng 💛'];for(let i=0;i<6;i++){const g=new THREE.Group(),body=new THREE.Mesh(new THREE.SphereGeometry(.52,20,14),new THREE.MeshStandardMaterial({color:0xff713d,emissive:0xff3c0a,emissiveIntensity:.6}));body.scale.y=1.15;g.add(body);[-.3,0,.3].forEach(y=>{const r=new THREE.Mesh(new THREE.TorusGeometry(.43,.035,8,20),new THREE.MeshStandardMaterial({color:0xffd27a}));r.rotation.x=Math.PI/2;r.position.y=y;g.add(r)});g.userData={a:i*Math.PI/3,r:6.5+(i%2),h:4+(i%3)*1.3,msg:messages[i]};group.add(g);lanterns.push(g)}
let downX=0,downY=0,drag=false,lastX,lastY;function down(x,y){drag=true;lastX=x;lastY=y;downX=x;downY=y}function move(x,y){if(!drag)return;theta-=(x-lastX)*.005;phi=Math.max(.3,Math.min(2.4,phi-(y-lastY)*.005));lastX=x;lastY=y;cameraUpdate()}function up(x,y){if(drag&&Math.abs(x-downX)<8&&Math.abs(y-downY)<8)tap(x,y);drag=false}const c=renderer.domElement;c.addEventListener('mousedown',e=>down(e.clientX,e.clientY));c.addEventListener('mousemove',e=>move(e.clientX,e.clientY));window.addEventListener('mouseup',e=>up(e.clientX,e.clientY));c.addEventListener('touchstart',e=>down(e.touches[0].clientX,e.touches[0].clientY),{passive:true});c.addEventListener('touchmove',e=>move(e.touches[0].clientX,e.touches[0].clientY),{passive:true});c.addEventListener('touchend',e=>up(e.changedTouches[0].clientX,e.changedTouches[0].clientY));c.addEventListener('wheel',e=>{dist=Math.max(10,Math.min(40,dist+e.deltaY*.02));cameraUpdate()},{passive:true});
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();function tap(x,y){mouse.set(x/innerWidth*2-1,-y/innerHeight*2+1);ray.setFromCamera(mouse,camera);const h=ray.intersectObjects(group.children,true);if(h.length){let o=h[0].object;while(o.parent&&!o.userData.msg)o=o.parent;if(o.userData.msg){document.getElementById('cardMsg').textContent=o.userData.msg;document.getElementById('cardOverlay').classList.add('show')}}}function closeCard(){document.getElementById('cardOverlay').classList.remove('show')}window.closeCard=closeCard;
let t=0,last=performance.now();function animate(){requestAnimationFrame(animate);const n=performance.now(),d=Math.min((n-last)/1000,.05);last=n;t+=d;theta+=d*.12;cameraUpdate();lanterns.forEach(g=>{g.userData.a+=d*.16;g.position.set(Math.cos(g.userData.a)*g.userData.r,g.userData.h+Math.sin(t*2+g.userData.a)*.3,Math.sin(g.userData.a)*g.userData.r);g.rotation.y+=d});canopy.rotation.y=Math.sin(t*.12)*.025;rabbit.rotation.y=Math.sin(t*.5)*.12;glow.material.opacity=.2+Math.sin(t*.7)*.03;renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const music=document.getElementById('musicPlayer');window.addEventListener('pointerdown',()=>{music.contentWindow.postMessage(JSON.stringify({event:'command',func:'unMute',args:[]}),'https://www.youtube.com');music.contentWindow.postMessage(JSON.stringify({event:'command',func:'playVideo',args:[]}),'https://www.youtube.com')},{once:true});
</script></body></html>
