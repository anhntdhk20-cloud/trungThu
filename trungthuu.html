<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Đêm Trung Thu 3D</title>
<style>
:root{box-sizing:border-box;--bg:#080416;--accent:#ff9b52;--pink:#ff6fae;--text:#fff7f0;--muted:#d8c9e5;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}*{box-sizing:inherit}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}#musicPlayer{position:fixed;width:1px;height:1px;border:0;opacity:0;pointer-events:none}#title{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;z-index:3;text-align:center;pointer-events:none}#title h1{font-size:clamp(17px,4vw,23px);margin:0;letter-spacing:1.5px;text-shadow:0 0 12px #ff8c5099}#title p{margin:7px 0;color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.8}#vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 50% 42%,transparent 25%,#0502102e 65%,#0502109e 100%)}#hint{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;z-index:3;transform:translateX(-50%);padding:8px 12px;border:1px solid #ffd6ae33;border-radius:999px;background:#130a26a0;backdrop-filter:blur(12px);color:var(--muted);font-size:11px;white-space:nowrap}#cardOverlay{position:fixed;inset:0;z-index:5;display:none;place-items:center;padding:20px;background:#050210b3;backdrop-filter:blur(8px)}#cardOverlay.show{display:grid}#card{width:min(360px,100%);padding:24px 18px;text-align:center;border:1px solid #ffaf7866;border-radius:18px;background:linear-gradient(160deg,#2a1740,#4a1f3a);box-shadow:0 24px 80px #0009}#card .lantern-emoji{font-size:40px}#card p{font-size:17px;line-height:1.5;margin:10px 0 18px}button{width:100%;padding:9px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--pink));color:#20101c;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div id="scene"></div><div id="title"><h1>🏮 Đêm Trăng Trung Thu 🏮</h1><p>Một đêm rằm thật dịu dàng</p></div><div id="vignette"></div><div id="hint">Kéo để xoay • Kéo 2 ngón để zoom • Chạm vào lồng đèn để xem lời chúc</div>
<div id="cardOverlay"><div id="card"><div class="lantern-emoji">🏮</div><p id="cardMsg"></p><button onclick="closeCard()">Đóng</button></div></div>
<iframe id="musicPlayer" src="https://www.youtube.com/embed/UdZeeNYpQys?autoplay=1&loop=1&playlist=UdZeeNYpQys&controls=0&rel=0&playsinline=1&enablejsapi=1" title="Nhạc Trung Thu" allow="autoplay; encrypted-media" aria-hidden="true"></iframe>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x0a0618,.02);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);let camDist=22,camTheta=.5,camPhi=1.15;
function updateCamera(){camera.position.set(camDist*Math.sin(camPhi)*Math.sin(camTheta),camDist*Math.cos(camPhi)+3,camDist*Math.sin(camPhi)*Math.cos(camTheta));camera.lookAt(0,4,0)}updateCamera();
const isMobile=matchMedia('(max-width:700px)').matches;const renderer=new THREE.WebGLRenderer({antialias:!isMobile,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,isMobile?1.35:1.8));renderer.setSize(innerWidth,innerHeight,false);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;document.getElementById('scene').appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x51406f,.62));const moonLight=new THREE.PointLight(0xffc766,1.7,65);moonLight.position.set(0,16,-6);scene.add(moonLight);const warmLight=new THREE.PointLight(0xff8f4d,.72,30);warmLight.position.set(0,3,4);scene.add(warmLight);
const planet=new THREE.Mesh(new THREE.SphereGeometry(7,isMobile?32:64,isMobile?24:40),new THREE.MeshStandardMaterial({color:0x40336f,roughness:.82,emissive:0x100c2d,emissiveIntensity:.22}));planet.position.y=-3.2;planet.scale.y=.78;scene.add(planet);
const trunkMat=new THREE.MeshStandardMaterial({color:0x2a1810,roughness:.9});const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35,.7,6,isMobile?10:14),trunkMat);trunk.position.y=.5;scene.add(trunk);for(let i=0;i<5;i++){const b=new THREE.Mesh(new THREE.CylinderGeometry(.08,.2,3,8),trunkMat);b.position.set(Math.sin(i*1.3)*1.2,3+i*.3,Math.cos(i*1.3)*1.2);b.rotation.z=Math.sin(i)*.8;b.rotation.x=Math.cos(i)*.6;scene.add(b)}const rabbitBranch=new THREE.Mesh(new THREE.CylinderGeometry(.16,.28,2.8,10),trunkMat);rabbitBranch.position.set(-1.15,3.45,.55);rabbitBranch.rotation.z=-.95;rabbitBranch.rotation.x=.18;scene.add(rabbitBranch);const branchTip=new THREE.Mesh(new THREE.SphereGeometry(.23,12,8),trunkMat);branchTip.position.set(-2.05,4.3,.7);scene.add(branchTip);
const foliageCount=isMobile?1100:2200,fPos=new Float32Array(foliageCount*3);for(let i=0;i<foliageCount;i++){const r=4.2*Math.cbrt(Math.random()),th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);fPos[i*3]=r*Math.sin(ph)*Math.cos(th);fPos[i*3+1]=6.5+r*Math.cos(ph)*.8;fPos[i*3+2]=r*Math.sin(ph)*Math.sin(th)}const foliageGeo=new THREE.BufferGeometry();foliageGeo.setAttribute('position',new THREE.BufferAttribute(fPos,3));scene.add(new THREE.Points(foliageGeo,new THREE.PointsMaterial({color:0xff7fc0,size:isMobile?.25:.22,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false})));
const moon=new THREE.Mesh(new THREE.SphereGeometry(2.2,32,24),new THREE.MeshBasicMaterial({color:0xffd46a}));moon.position.set(0,15,-8);scene.add(moon);const moonGlow=new THREE.Mesh(new THREE.SphereGeometry(3.05,24,16),new THREE.MeshBasicMaterial({color:0xffad45,transparent:true,opacity:.18,blending:THREE.AdditiveBlending,depthWrite:false}));moonGlow.position.copy(moon.position);scene.add(moonGlow);const moonHalo=new THREE.PointLight(0xffbd55,.65,28);moonHalo.position.copy(moon.position);scene.add(moonHalo);
// Rabbit: giữ nguyên phong cách đơn giản, giảm nhẹ số polygon trên màn hình nhỏ.
const fur=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xfff5ea,emissiveIntensity:.35,roughness:.65}),pink=new THREE.MeshStandardMaterial({color:0xffa0b8,emissive:0x662030,roughness:.6}),rabbit=new THREE.Group();function addRabbitPart(geo,pos,scale,mat=fur){const m=new THREE.Mesh(geo,mat);m.position.set(...pos);m.scale.set(...scale);rabbit.add(m)}const seg=isMobile?18:28;addRabbitPart(new THREE.SphereGeometry(.92,seg,16),[0,.08,0],[.92,1.02,1.08]);addRabbitPart(new THREE.SphereGeometry(.58,seg,16),[0,1.08,.32],[1.02,1,.96]);[-.2,.2].forEach(x=>{addRabbitPart(new THREE.SphereGeometry(.17,16,12),[x,1.83,.25],[.68,2.75,.7]);addRabbitPart(new THREE.SphereGeometry(.095,14,10),[x,1.8,.36],[.56,2.35,.42],pink)});rabbit.position.set(.15,2.02,2.45);rabbit.scale.setScalar(.78);scene.add(rabbit);
const lanterns=[],lanternGroup=new THREE.Group(),lanternMat=new THREE.MeshStandardMaterial({color:0xff8a3d,emissive:0xff5a10,emissiveIntensity:.6,roughness:.5}),capMat=new THREE.MeshStandardMaterial({color:0xffd27a,emissive:0xffaa40,emissiveIntensity:.5}),darkMat=new THREE.MeshStandardMaterial({color:0x7c2b2a,roughness:.55});scene.add(lanternGroup);const messages=['Chúc bạn Trung Thu ấm áp bên gia đình, đủ đầy như ánh trăng rằm 🌕','Ước mong mọi buồn lo tan theo ánh đèn lồng, chỉ còn lại niềm vui ở lại 🏮','Trăng tròn thì lòng người cũng tròn, chúc bạn luôn hạnh phúc và bình an ✨','Gửi bạn một chiếc bánh Trung Thu ngọt ngào, chúc năm mới học hành tấn tới 🥮','Dưới ánh trăng này, chúc bạn gặp nhiều may mắn và những điều tốt đẹp 🌙','Chúc bạn có một mùa Trung Thu rực rỡ như muôn ngàn ánh đèn lồng 🎇'];for(let i=0;i<6;i++){const g=new THREE.Group(),body=new THREE.Mesh(new THREE.SphereGeometry(.55,16,12),lanternMat.clone());body.scale.set(.88,1.08,.88);g.add(body);const ring=new THREE.Mesh(new THREE.TorusGeometry(.43,.035,6,16),darkMat);ring.rotation.x=Math.PI/2;[-.28,0,.28].forEach(y=>{const r=ring.clone();r.position.y=y;g.add(r)});const top=new THREE.Mesh(new THREE.ConeGeometry(.42,.25,10),capMat);top.position.y=.62;g.add(top);const bottom=top.clone();bottom.rotation.x=Math.PI;bottom.position.y=-.62;g.add(bottom);const a=i*Math.PI/3;g.userData={angle:a,radius:6.5+(i%2)*1.2,height:3.5+(i%3)*1.4,speed:.15+Math.random()*.1,msg:messages[i]};lanternGroup.add(g);lanterns.push(g)}
const starGeo=new THREE.BufferGeometry(),starCount=isMobile?900:1800,starPos=new Float32Array(starCount*3);for(let i=0;i<starCount;i++){starPos[i*3]=(Math.random()-.5)*100;starPos[i*3+1]=3+Math.random()*38;starPos[i*3+2]=(Math.random()-.5)*100}starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));const starField=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffe4b0,size:.22,transparent:true,opacity:.9,depthWrite:false}));scene.add(starField);
// Pointer events: kéo một ngón để xoay, pinch hai ngón để zoom mượt trên điện thoại.
let dragging=false,lastX=0,lastY=0,pinchStart=0,pinchDist=0;const canvas=renderer.domElement;function pointDistance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}function beginPointer(e){if(e.pointerType==='touch'&&e.isPrimary===false)return;dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture?.(e.pointerId)}function movePointer(e){if(!dragging)return;camTheta-=(e.clientX-lastX)*.005;camPhi=Math.max(.3,Math.min(2.4,camPhi-(e.clientY-lastY)*.005));lastX=e.clientX;lastY=e.clientY;updateCamera()}function endPointer(e){dragging=false;canvas.releasePointerCapture?.(e.pointerId)}canvas.addEventListener('pointerdown',beginPointer,{passive:false});canvas.addEventListener('pointermove',movePointer,{passive:false});canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);canvas.addEventListener('wheel',e=>{e.preventDefault();camDist=Math.max(10,Math.min(40,camDist+e.deltaY*.02));updateCamera()},{passive:false});canvas.addEventListener('touchstart',e=>{if(e.touches.length===2){dragging=false;pinchDist=pointDistance(e.touches[0],e.touches[1]);pinchStart=camDist}},{passive:true});canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=pointDistance(e.touches[0],e.touches[1]);camDist=Math.max(10,Math.min(40,pinchStart-(d-pinchDist)*.035));updateCamera();e.preventDefault()}},{passive:false});
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();function openCard(msg){document.getElementById('cardMsg').textContent=msg;document.getElementById('cardOverlay').classList.add('show')}function closeCard(){document.getElementById('cardOverlay').classList.remove('show')}window.closeCard=closeCard;let tapX=0,tapY=0;canvas.addEventListener('pointerdown',e=>{tapX=e.clientX;tapY=e.clientY});canvas.addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-tapX,e.clientY-tapY)<8){mouse.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(lanternGroup.children,true);if(hits.length){let o=hits[0].object;while(o.parent&&!o.userData.msg)o=o.parent;if(o.userData.msg)openCard(o.userData.msg)}}});
let running=true,raf=0,t=0,last=performance.now();document.addEventListener('visibilitychange',()=>{running=!document.hidden;if(running){last=performance.now();animate()}});function animate(){if(!running)return;raf=requestAnimationFrame(animate);const now=performance.now(),dt=Math.min((now-last)/1000,.05);last=now;t+=dt;camTheta+=dt*.12;updateCamera();lanterns.forEach(g=>{g.userData.angle+=g.userData.speed*dt;g.position.set(Math.cos(g.userData.angle)*g.userData.radius,g.userData.height+Math.sin(t*2+g.userData.angle)*.3,Math.sin(g.userData.angle)*g.userData.radius);g.rotation.y+=dt;g.scale.setScalar(1+Math.sin(t*2.5+g.userData.angle)*.035)});rabbit.rotation.y=Math.sin(t*.5)*.15;moonGlow.material.opacity=.22+Math.sin(t*.7)*.035;starField.rotation.y+=dt*.02;renderer.render(scene,camera)}animate();
let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,isMobile?1.35:1.8));renderer.setSize(innerWidth,innerHeight,false)},100)});const music=document.getElementById('musicPlayer');addEventListener('pointerdown',()=>{music.contentWindow.postMessage(JSON.stringify({event:'command',func:'unMute',args:[]}),'https://www.youtube.com');music.contentWindow.postMessage(JSON.stringify({event:'command',func:'playVideo',args:[]}),'https://www.youtube.com')},{once:true});
</script></body></html>
